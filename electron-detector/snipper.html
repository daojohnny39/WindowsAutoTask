<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data:;">
  <title>Snipper</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; cursor:crosshair; user-select:none; }
    #bg { position:absolute; inset:0; width:100%; height:100%; display:block; }
    #hud { position:fixed; pointer-events:none; padding:4px 8px; background:rgba(0,0,0,0.7); color:#fff; font:12px monospace; border-radius:3px; display:none; z-index:10; }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div id="hud"></div>
  <script src="./snipper.js" defer></script>
</body>
</html>
