<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Windows Autobot</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="./node_modules/katex/dist/katex.min.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">Windows Autobot</div>
    <div class="nav-links" id="nav-links">
      <button class="nav-link active" data-page="apps">All Apps</button>
      <button class="nav-link" data-page="selected-apps">Apps</button>
      <button class="nav-link" data-page="elements">Debug</button>
    </div>
    <div class="nav-right">
      <button class="codex-login-btn" id="codex-login-btn" disabled>Checking...</button>
      <div class="codex-install-error" id="codex-install-error"></div>
    </div>
  </nav>

  <div class="codex-modal" id="codex-modal">
    <div class="codex-modal-box">
      <div class="codex-modal-title">Logging in with ChatGPT</div>
      <div class="codex-modal-msg" id="codex-modal-msg">Browser opening — complete login there.</div>
      <div class="spinner codex-modal-spinner"></div>
      <button class="codex-modal-cancel" id="codex-modal-cancel">Cancel</button>
    </div>
  </div>

  <!-- Apps Page -->
  <div class="page active" id="page-apps">
    <div class="header">
      <div class="header-left">
        <span class="subtitle" id="count-badge">Scanning...</span>
        <div class="view-toggle" id="view-toggle">
          <button class="view-btn active" data-view="all">All</button>
          <button class="view-btn" data-view="selected">Selected</button>
        </div>
      </div>
      <button class="refresh-btn" id="refresh-btn" title="Refresh">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        Refresh
      </button>
    </div>

    <div class="app-list" id="app-list">
      <div class="loading">
        <div class="spinner"></div>
        <p>Detecting apps...</p>
      </div>
    </div>

    <div class="status-bar" id="status-bar"></div>

    <div class="footer">
      <span>Electron via Win32_Process &bull; Other apps via UI Automation accessibility tree</span>
    </div>
  </div>

  <!-- Selected Apps Page -->
  <div class="page" id="page-selected-apps">
    <div class="header">
      <div class="header-left">
        <span class="subtitle" id="selected-apps-badge">Scanning...</span>
        <div class="view-toggle" id="selected-apps-view-toggle">
          <button class="view-btn active" data-sa-view="apps">Apps</button>
          <button class="view-btn" data-sa-view="automations">Automations</button>
        </div>
        <button class="automation-back-btn" id="automation-back-btn" title="Back to apps" style="display:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span id="automation-back-label">Back</span>
        </button>
      </div>
      <div class="header-right">
        <button class="refresh-btn add-automation-btn" id="add-automation-btn" title="Add automation" style="display:none">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Add automation
        </button>
        <button class="refresh-btn" id="selected-apps-refresh-btn" title="Refresh">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          Refresh
        </button>
      </div>
    </div>

    <div class="app-list" id="selected-apps-list">
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading selected apps...</p>
      </div>
    </div>
  </div>

  <!-- Elements Page -->
  <div class="page" id="page-elements">
    <div class="header">
      <div class="header-left">
        <span class="subtitle" id="elements-badge">Scanning...</span>
      </div>
      <button class="refresh-btn" id="elements-refresh-btn" title="Refresh">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        Refresh
      </button>
    </div>

    <div class="elements-list" id="elements-list">
      <div class="loading">
        <div class="spinner"></div>
        <p>Detecting apps...</p>
      </div>
    </div>
  </div>

  <!-- Chat Page -->
  <div class="page" id="page-chat">
    <div class="chat-header">
      <button class="chat-back-btn" id="chat-back-btn" title="Back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <span class="chat-app-name" id="chat-app-name"></span>
      <button class="chat-new-btn" id="chat-new-btn" title="New Chat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        New Chat
      </button>
    </div>
    <div class="chat-messages" id="chat-messages">
      <div class="chat-welcome">
        <div class="chat-welcome-icon">&#9672;</div>
        <p>Start a conversation</p>
      </div>
    </div>
    <div class="chat-composer">
      <div class="chat-input-wrap">
        <textarea class="chat-input" id="chat-input" placeholder="Send a message..." rows="1"></textarea>
        <button class="chat-send-btn" id="chat-send-btn" title="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
